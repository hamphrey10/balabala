# QUANT DERIV AI — default configuration (DEMO only)
# Validated by Pydantic models in quant_deriv_ai.config.settings

app:
  name: quant-deriv-ai
  environment: development
  log_level: INFO

trading:
  # Only "demo" is accepted in this phase.
  mode: demo
  allow_live: false

risk:
  # Principles only — numeric limits refined in later lots.
  capital_preservation_priority: true
  martingale_forbidden: true
  aggressive_loss_recovery_forbidden: true
  require_demonstrated_edge: true
  abstain_without_edge: true

mt5:
  # Connection parameters come from environment variables, never from this file's secrets.
  enabled: false
  # Path to terminal executable (Windows). Empty on non-Windows hosts.
  terminal_path: ""
  timeout_ms: 60000
  max_retries: 3
  backoff_base_s: 0.5
  heartbeat_interval_s: 30

data:
  # Local market-data root (Parquet + DuckDB + SQLite metadata). Gitignored.
  root: data
  # Default candle timeframes actually requested from MT5 (subset of available).
  default_timeframes:
    - M1
    - M5
    - M15
    - M30
    - H1
    - H4
    - D1
  # Freshness: max age of last bar/tick before a series is considered stale.
  freshness_max_age_s: 300
  # Outlier detection: relative return z-score threshold (never auto-fills gaps).
  outlier_zscore: 8.0
  # Controlled reconstruction is OFF by default — missing bars stay missing.
  allow_reconstruction: false

technical:
  # LOT-004 — Technical Analysis Agent defaults (no orders).
  # Synthetic / tick volumes must not be treated as real liquidity.
  volume_is_synthetic: true
  swing_left: 2
  swing_right: 2
  breakout_lookback: 20
  sma_fast: 20
  sma_slow: 50

logging:
  structured: true
  serialize: false
  sink: stderr
