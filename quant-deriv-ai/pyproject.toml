[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-deriv-ai"
version = "0.1.0"
description = "QUANT DERIV AI — modular algorithmic trading system (DEMO-only)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "LicenseRef-Proprietary"
authors = [{ name = "QUANT DERIV AI" }]
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "PyYAML>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "typer>=0.12,<1",
    "rich>=13.7,<14",
    "loguru>=0.7,<1",
    "websockets>=12,<16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5.0,<6",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "types-PyYAML>=6.0,<7",
]
# MetaTrader5 ships Windows wheels only; install on Windows hosts when needed.
mt5 = [
    "MetaTrader5>=5.0.45",
]

[project.scripts]
quant = "quant_deriv_ai.cli.app:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quant_deriv_ai = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires real MT5 DEMO terminal + credentials (skipped/BLOCKED otherwise)",
    "unit: pure unit tests with mocks",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
packages = ["quant_deriv_ai"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["MetaTrader5.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["websockets.*"]
ignore_missing_imports = true
